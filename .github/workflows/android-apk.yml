name: Build Savash Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/**"]
    paths:
      - "index.html"
      - "config.js"
      - "game.js"
      - "multiplayer.js"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "file_00000000d45c81f48ba3ab6d5282ec87.png"
      - "scripts/**"
      - "server/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game scripts and assets
        run: npm run check
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare complete game assets
        run: |
          mkdir -p www
          cp index.html config.js multiplayer.js game.js manifest.webmanifest sw.js file_00000000d45c81f48ba3ab6d5282ec87.png www/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Savash-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
