name: Build Savash Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "savash-bg.jpg"
      - "savash-track-5.mp3"
      - "assets/savash-theme.mp3"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare game assets
        run: |
          mkdir -p www/assets
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          test -s savash-bg.jpg
          cp savash-bg.jpg www/savash-bg.jpg
          test -s savash-track-5.mp3
          cp savash-track-5.mp3 www/savash-track-5.mp3
          if [ -s assets/savash-theme.mp3 ]; then
            cp assets/savash-theme.mp3 www/assets/savash-theme.mp3
          fi
          cp sw.js www/sw.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure release signing
        env:
          SAVASH_KEYSTORE_BASE64: ${{ secrets.SAVASH_KEYSTORE_BASE64 }}
          SAVASH_STORE_PASSWORD: ${{ secrets.SAVASH_STORE_PASSWORD }}
          SAVASH_KEY_ALIAS: ${{ secrets.SAVASH_KEY_ALIAS }}
          SAVASH_KEY_PASSWORD: ${{ secrets.SAVASH_KEY_PASSWORD }}
        run: |
          test -n "$SAVASH_KEYSTORE_BASE64"
          test -n "$SAVASH_STORE_PASSWORD"
          test -n "$SAVASH_KEY_ALIAS"
          test -n "$SAVASH_KEY_PASSWORD"
          printf '%s' "$SAVASH_KEYSTORE_BASE64" | base64 --decode > android/app/savash-release.jks
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("savash-release.jks")
                      storePassword System.getenv("SAVASH_STORE_PASSWORD")
                      keyAlias System.getenv("SAVASH_KEY_ALIAS")
                      keyPassword System.getenv("SAVASH_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build signed release APK
        env:
          SAVASH_STORE_PASSWORD: ${{ secrets.SAVASH_STORE_PASSWORD }}
          SAVASH_KEY_ALIAS: ${{ secrets.SAVASH_KEY_ALIAS }}
          SAVASH_KEY_PASSWORD: ${{ secrets.SAVASH_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Savash-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
