
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SAVASH - Squad Combat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
 touch-action:none
}
#hud{
 height:55px;background:#172631;
 display:flex;align-items:center;
 justify-content:space-around;font-weight:bold;
 font-size:13px
}
canvas{
 display:block;width:100vw;
 height:calc(100dvh - 55px);
 background:#68764a;touch-action:none
}
#pad{
 position:fixed;bottom:20px;left:15px;
 display:grid;grid-template:repeat(3,48px)/repeat(3,48px);
 gap:4px
}
button{
 color:white;background:#172631dd;
 border:1px solid #ffffff66;border-radius:12px;
 font-weight:bold;touch-action:none
}
#pad button{font-size:22px}
#fire{
 position:fixed;right:22px;bottom:40px;
 width:85px;height:85px;border-radius:50%;
 background:#a52a2a;font-size:17px
}
#message{
 display:none;position:fixed;top:40%;left:50%;
 transform:translate(-50%,-50%);
 background:#101820f5;padding:25px;
 border-radius:15px;text-align:center;
 width:85%;max-width:320px
}
#restart{padding:12px 25px;font-size:17px}
</style>
</head>
<body>

<div id="hud">
 <span>⚔ SAVASH</span>
 <span id="hp">❤️ 100</span>
 <span id="level">LEVEL 1</span>
 <span id="kills">KILLS 0</span>
</div>

<canvas id="game"></canvas>

<div id="pad">
 <button data-d="up" style="grid-area:1/2">▲</button>
 <button data-d="left" style="grid-area:2/1">◀</button>
 <button data-d="down" style="grid-area:3/2">▼</button>
 <button data-d="right" style="grid-area:2/3">▶</button>
</div>

<button id="fire">FIRE</button>

<div id="message">
 <h2>MISSION FAILED</h2>
 <p id="result"></p>
 <button id="restart">PLAY AGAIN</button>
</div>

<script>
(()=>{
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W,H,D;
let player,team,enemies,bullets;
let keys={},touch={};
let level=1,kills=0;
let firing=false,ended=false,last=0;

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}

function reset(){
 player={x:W/2,y:H/2,hp:100,cd:0};
 team=Array.from({length:5},(_,i)=>({
 x:W/2+(i-2)*25,y:H/2+45,cd:Math.random()
 }));
 enemies=[];
 bullets=[];
 kills=0;
 level=1;
 ended=false;
 firing=false;
 $("message").style.display="none";
 for(let i=0;i<5;i++)spawn();
 hud();
}

function spawn(){
 let side=Math.floor(Math.random()*4);
 enemies.push({
 x:side===0?10:side===1?W-10:Math.random()*W,
 y:side===2?10:side===3?H-10:Math.random()*H,
 hp:35+level*9,
 max:35+level*9,
 speed:30+level*5,
 cd:0.5
 });
}

function nearest(x,y,list){
 let best=null,dist=Infinity;
 for(let a of list){
  let d=Math.hypot(a.x-x,a.y-y);
  if(d<dist){dist=d;best=a;}
 }
 return best;
}

function move(a,x,y,speed,dt){
 let dx=x-a.x,dy=y-a.y;
 let d=Math.hypot(dx,dy);
 if(d>1){
  a.x+=dx/d*speed*dt;
  a.y+=dy/d*speed*dt;
 }
 a.x=Math.max(12,Math.min(W-12,a.x));
 a.y=Math.max(12,Math.min(H-12,a.y));
}

function shoot(a,e){
 if(!e)return;
 let angle=Math.atan2(e.y-a.y,e.x-a.x);
 bullets.push({
  x:a.x,y:a.y,
  vx:Math.cos(angle)*400,
  vy:Math.sin(angle)*400,
  life:1.2
 });
}

function hud(){
 $("hp").textContent="❤️ "+Math.ceil(player.hp);
 $("level").textContent="LEVEL "+level;
 $("kills").textContent="KILLS "+kills;
}

function update(dt){
 if(ended)return;

 let dx=(keys.ArrowRight||keys.d||touch.right?1:0)
       -(keys.ArrowLeft||keys.a||touch.left?1:0);

 let dy=(keys.ArrowDown||keys.s||touch.down?1:0)
       -(keys.ArrowUp||keys.w||touch.up?1:0);

 let n=Math.hypot(dx,dy)||1;

 player.x+=dx/n*190*dt;
 player.y+=dy/n*190*dt;

 player.x=Math.max(12,Math.min(W-12,player.x));
 player.y=Math.max(12,Math.min(H-12,player.y));

 team.forEach((s,i)=>{
  let a=i*Math.PI*2/5;
  let tx=player.x+Math.cos(a)*45;
  let ty=player.y+Math.sin(a)*45;

  if(Math.hypot(tx-s.x,ty-s.y)>12)
   move(s,tx,ty,150,dt);

  s.cd-=dt;
  let e=nearest(s.x,s.y,enemies);

  if(e&&Math.hypot(e.x-s.x,e.y-s.y)<320&&s.cd<=0){
   shoot(s,e);
   s.cd=.65;
  }
 });

 player.cd-=dt;
 let target=nearest(player.x,player.y,enemies);

 if(firing&&target&&player.cd<=0){
  shoot(player,target);
  player.cd=.18;
 }

 enemies.forEach(e=>{
  let target=nearest(e.x,e.y,[player,...team]);

  if(target)move(e,target.x,target.y,e.speed,dt);

  e.cd-=dt;

  if(Math.hypot(player.x-e.x,player.y-e.y)<27&&e.cd<=0){
   player.hp-=8;
   e.cd=.8;
  }
 });

 bullets.forEach(b=>{
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  let e=nearest(b.x,b.y,enemies);

  if(e&&Math.hypot(e.x-b.x,e.y-b.y)<16){
   e.hp-=25;
   b.life=0;
  }
 });

 bullets=bullets.filter(b=>
  b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20
 );

 let old=enemies.length;
 enemies=enemies.filter(e=>e.hp>0);
 kills+=old-enemies.length;

 while(enemies.length<Math.min(5+level,15))
  spawn();

 if(kills>=level*10&&level<20){
  level++;
 }

 if(player.hp<=0){
  player.hp=0;
  ended=true;
  $("result").textContent="Your kills: "+kills;
  $("message").style.display="block";
 }

 hud();
}

function soldier(a,color,scale=1){
 ctx.save();
 ctx.translate(a.x,a.y);
 ctx.scale(scale,scale);

 ctx.fillStyle="#17212a";
 ctx.beginPath();
 ctx.arc(0,0,10,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=color;
 ctx.fillRect(-8,-4,16,18);

 ctx.fillStyle="#d8b28a";
 ctx.beginPath();
 ctx.arc(0,-10,6,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#222";
 ctx.fillRect(4,2,16,3);

 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#68764a";
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#78875a";

 for(let x=0;x<W;x+=48){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H);
  ctx.stroke();
 }

 for(let y=0;y<H;y+=48){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 team.forEach(s=>soldier(s,"#4e9a54",.85));
 soldier(player,"#2f75c8",1.2);

 enemies.forEach(e=>{
  soldier(e,"#a93636");

  ctx.fillStyle="#222";
  ctx.fillRect(e.x-13,e.y-25,26,4);

  ctx.fillStyle="#ef4444";
  ctx.fillRect(e.x-13,e.y-25,26*Math.max(0,e.hp/e.max),4);
 });

 bullets.forEach(b=>{
  ctx.fillStyle="#ffe066";
  ctx.beginPath();
  ctx.arc(b.x,b.y,4,0,Math.PI*2);
  ctx.fill();
 });
}

function loop(t){
 let dt=Math.min(.04,(t-last)/1000||0);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key.startsWith("Arrow"))e.preventDefault();
});

addEventListener("keyup",e=>keys[e.key]=false);

document.querySelectorAll("#pad button").forEach(b=>{
 let d=b.dataset.d;

 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  touch[d]=true;
  b.setPointerCapture(e.pointerId);
 });

 ["pointerup","pointercancel","lostpointercapture"].forEach(v=>{
  b.addEventListener(v,()=>touch[d]=false);
 });
});

$("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 firing=true;
 $("fire").setPointerCapture(e.pointerId);
});

["pointerup","pointercancel","lostpointercapture"].forEach(v=>{
 $("fire").addEventListener(v,()=>firing=false);
});

$("restart").addEventListener("click",reset);

addEventListener("resize",()=>{
 resize();
 if(player){
  player.x=W/2;
  player.y=H/2;
 }
});

resize();
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
